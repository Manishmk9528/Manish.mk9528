<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manish Kumar | Nature Photography</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0f0d;
            color: white;
            line-height: 1.6;
        }

        header {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            background:
                linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
                url("images/hero.jpg") center/cover no-repeat;
        }

        .hero h1 {
            font-size: 55px;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 20px;
            color: #d5d5d5;
        }

        .hero-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            border: 1px solid white;
            color: white;
            text-decoration: none;
            border-radius: 30px;
        }

        section {
            padding: 70px 8%;
        }

        .title {
            text-align: center;
            font-size: 35px;
            margin-bottom: 40px;
        }

        .intro {
            max-width: 700px;
            margin: auto;
            text-align: center;
            color: #cccccc;
            font-size: 18px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #050706;
            color: #999;
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 38px;
            }

            .hero p {
                font-size: 17px;
            }

            section {
                padding: 50px 6%;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="hero">
            <h1>MANISH KUMAR</h1>
            <p>Nature • Landscapes • Photography</p>
            <a href="#gallery" class="hero-button">Explore My Work</a>
        </div>
    </header>

    <section>
        <h2 class="title">About My Photography</h2>

        <p class="intro">
            Welcome to my photography portfolio.
            I capture the beauty of nature, landscapes and
            the little moments that make the world worth looking at.
        </p>
    </section>

    <section id="gallery">
        <h2 class="title">My Photographs</h2>

        <div class="gallery">

            <img src="images/photo1.jpg" alt="Nature photograph">
            <img src="images/photo2.jpg" alt="Landscape photograph">
            <img src="images/photo3.jpg" alt="Nature photograph">
            <img src="images/photo4.jpg" alt="Landscape photograph">
            <img src="images/photo5.jpg" alt="Nature photograph">
            <img src="images/photo6.jpg" alt="Nature photograph">

        </div>
    </section>

    <footer>
        © 2026 Manish Kumar Photography
    </footer>

</body>
    </html>
